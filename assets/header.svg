<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Hey, I'm Phanun — C# and .NET developer building POS and business systems">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".40"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
      @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,40px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
      @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
      .b1{animation:drift1 14s ease-in-out infinite}
      .b2{animation:drift2 18s ease-in-out infinite}
      .b3{animation:drift3 16s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .r1{opacity:0;animation:rise .7s .1s ease-out forwards}
      .r2{opacity:0;animation:rise .7s .3s ease-out forwards}
      .r3{opacity:0;animation:rise .7s .5s ease-out forwards}
      .r4{opacity:0;animation:rise .7s .7s ease-out forwards}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .dot{animation:pulse 1.6s ease-in-out infinite}
      @keyframes roles{0%,28%{opacity:1}33%,100%{opacity:0}}
      .role{opacity:0;animation:roles 9s infinite}
      .role:nth-of-type(2){animation-delay:3s}
      .role:nth-of-type(3){animation-delay:6s}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .caret{animation:blink 1s step-end infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .f1{animation:float 5s ease-in-out infinite}
      .f2{animation:float 6s 1s ease-in-out infinite}
      .f3{animation:float 5.5s .5s ease-in-out infinite}
      .f4{animation:float 6.5s 1.5s ease-in-out infinite}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0A0A12"/>
    <circle class="b1" cx="860" cy="90" r="300" fill="url(#b1)"/>
    <circle class="b2" cx="1100" cy="330" r="260" fill="url(#b2)"/>
    <circle class="b3" cx="160" cy="400" r="260" fill="url(#b3)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#fade)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- status pill -->
  <g class="r1">
    <rect x="64" y="56" width="214" height="32" rx="16" fill="#A3E635" fill-opacity=".10" stroke="#A3E635" stroke-opacity=".45"/>
    <circle class="dot" cx="84" cy="72" r="5" fill="#A3E635"/>
    <text x="98" y="77" class="mono" font-size="14" fill="#D9F99D">open to collabs</text>
  </g>

  <!-- name -->
  <g class="r2">
    <text x="62" y="138" class="sans" font-size="26" font-weight="500" fill="#A1A1AA">hey, i'm</text>
    <text x="58" y="218" class="sans" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#name)">Phanun.</text>
  </g>

  <!-- rotating line -->
  <g class="r3 mono" font-size="20">
    <text x="64" y="262" fill="#71717A">&gt;</text>
    <text x="86" y="262" fill="#E4E4E7">i build</text>
    <g>
      <text class="role" x="178" y="262" fill="#F472B6">POS systems<tspan class="caret" fill="#F472B6">_</tspan></text>
      <text class="role" x="178" y="262" fill="#C4B5FD">management apps<tspan class="caret" fill="#C4B5FD">_</tspan></text>
      <text class="role" x="178" y="262" fill="#67E8F9">business web apps<tspan class="caret" fill="#67E8F9">_</tspan></text>
    </g>
  </g>

  <!-- meta row -->
  <g class="r4 sans" font-size="15" fill="#A1A1AA">
    <text x="64" y="318">C# Windows &amp; Web dev<tspan fill="#52525B" dx="10">•</tspan><tspan dx="10">@ Marunix (Cambodia)</tspan><tspan fill="#52525B" dx="10">•</tspan><tspan dx="10">Phnom Penh, KH</tspan></text>
  </g>

  <!-- stickers -->
  <g class="f1"><g transform="translate(760 70) rotate(-6)">
    <rect width="190" height="46" rx="12" fill="#18181B" stroke="#C4B5FD" stroke-opacity=".6"/>
    <text x="95" y="29" text-anchor="middle" class="mono" font-size="15" fill="#E9D5FF">&lt;/&gt; C# · .NET</text>
  </g></g>
  <g class="f2"><g transform="translate(990 120) rotate(7)">
    <rect width="150" height="46" rx="23" fill="#FDE68A"/>
    <text x="75" y="29" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#18181B">coffee-driven ☕</text>
  </g></g>
  <g class="f3"><g transform="translate(800 190) rotate(4)">
    <rect width="214" height="46" rx="12" fill="#F472B6"/>
    <text x="107" y="29" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#18181B">Ctrl + S enjoyer</text>
  </g></g>
  <g class="f4"><g transform="translate(1000 250) rotate(-8)">
    <rect width="140" height="46" rx="12" fill="#18181B" stroke="#67E8F9" stroke-opacity=".6"/>
    <text x="70" y="29" text-anchor="middle" class="mono" font-size="15" fill="#A5F3FC">ships ✓ fr</text>
  </g></g>
</svg>
